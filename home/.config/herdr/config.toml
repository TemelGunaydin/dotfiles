onboarding = false

[keys]
# Press Ctrl+A once, release it, then press the action key.
prefix = "ctrl+a"

# Match tmux split-window -h (side by side) and -v (stacked).
split_vertical   = "prefix+|"
split_horizontal = "prefix+minus"

reload_config = "prefix+r"
zoom = "prefix+m"
close_pane = "prefix+ctrl+k"

# Herdr uses its own resize step, not tmux's 5-cell increment or bind -r.
# Prefix + arrows resize panes, leaving h/j/k/l free for navigation.
resize_pane_left  = "prefix+left"
resize_pane_down  = "prefix+down"
resize_pane_up    = "prefix+up"
resize_pane_right = "prefix+right"
# Keep resize mode available without conflicting with reload_config.
resize_mode = "prefix+shift+r"

# Navigate between panes with Neovim-style h/j/k/l keys.
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"

new_tab   = "prefix+c"
close_tab = "prefix+ampersand"
workspace_picker = "prefix+w"
goto             = "prefix+g"
# Copy mode already uses vi keys: v/Space selects, y/Enter copies, q/Esc exits.
copy_mode = "prefix+["

[ui]
# Copy mouse selections automatically.
copy_on_select = true
# Agents panel order: explicit choice of "spaces" (grouped by space, the default) over "priority".
agent_panel_sort = "spaces"
